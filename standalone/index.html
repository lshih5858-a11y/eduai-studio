<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 주식 투자 학습 코치</title>
<style>
  :root {
    --navy-900:#0d1226; --navy-800:#161d3b; --navy-700:#1f2a52; --navy-600:#2b386c;
    --navy-500:#3d4c8c; --navy-300:#8494c9; --navy-200:#b0bcdf; --navy-100:#d7ddef; --navy-50:#eef1f8;
    --mint-800:#0c5443; --mint-700:#106f58; --mint-600:#158e70; --mint-500:#1fb28c;
    --mint-300:#6adcbe; --mint-200:#9dead4; --mint-100:#c8f4e7; --mint-50:#e9fbf6;
    --orange-700:#9a3412; --orange-600:#ea580c; --orange-500:#f97316; --orange-50:#fff7ed;
    --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-400:#94a3b8;
    --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body {
    background:var(--slate-50); color:var(--navy-900);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", Roboto, sans-serif;
    line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  button, input { font-family: inherit; }
  a { color: inherit; }
  .container { max-width:1200px; margin:0 auto; padding:0 20px; }

  /* header */
  header.app-header { position:sticky; top:0; z-index:30; background:rgba(255,255,255,0.97); border-bottom:1px solid var(--slate-200); backdrop-filter:blur(6px); }
  .header-top { display:flex; align-items:center; gap:10px; padding:12px 0 0; }
  .logo-box { width:36px; height:36px; border-radius:10px; background:var(--navy-700); display:flex; align-items:center; justify-content:center; color:var(--mint-300); flex-shrink:0; }
  .brand-title { font-size:17px; font-weight:800; color:var(--navy-900); line-height:1.2; margin:0; }
  .brand-sub { font-size:11px; color:var(--slate-400); margin:0; }
  nav.app-nav { display:flex; gap:6px; overflow-x:auto; padding:10px 0 8px; }
  nav.app-nav button {
    white-space:nowrap; border:none; border-radius:8px; padding:7px 12px; font-size:13.5px; font-weight:600;
    background:transparent; color:var(--slate-500); cursor:pointer; transition:background .15s,color .15s;
  }
  nav.app-nav button:hover { background:var(--slate-100); color:var(--navy-700); }
  nav.app-nav button.active { background:var(--navy-700); color:#fff; }
  .disclaimer-bar { background:var(--mint-50); color:var(--mint-800); text-align:center; font-size:12px; font-weight:600; padding:6px 12px; }

  main#main-content { max-width:1200px; margin:0 auto; padding:28px 20px; }
  footer.app-footer { max-width:1200px; margin:0 auto; padding:0 20px 40px; }

  h2.section-title { font-size:22px; font-weight:800; color:var(--navy-900); margin:0 0 4px; }
  p.section-desc { margin:0 0 20px; font-size:14px; color:var(--slate-500); }

  .card { background:#fff; border-radius:16px; border:1px solid var(--slate-100); box-shadow:0 4px 24px rgba(13,18,38,.08); }
  .card-pad { padding:24px; }

  .btn-primary {
    display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:10px;
    background:var(--navy-700); color:#fff; padding:10px 18px; font-size:14px; font-weight:700; cursor:pointer;
    transition:background .15s;
  }
  .btn-primary:hover { background:var(--navy-600); }
  .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn-secondary {
    display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--navy-200); border-radius:10px;
    background:#fff; color:var(--navy-700); padding:9px 16px; font-size:13.5px; font-weight:700; cursor:pointer;
    transition:background .15s;
  }
  .btn-secondary:hover { background:var(--navy-50); }

  .disclaimer { border:1px solid var(--mint-200); background:var(--mint-50); color:var(--mint-800); border-radius:10px; padding:11px 16px; font-size:13.5px; }
  .risk-badge { border:1px solid var(--orange-500); background:var(--orange-50); color:var(--orange-700); border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:600; }

  /* grids */
  .grid { display:grid; gap:16px; }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .grid-5 { grid-template-columns:repeat(5,1fr); }
  @media (max-width:1000px){ .grid-5{ grid-template-columns:repeat(3,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:640px){ .grid-2,.grid-3,.grid-5{ grid-template-columns:1fr; } }

  /* hero */
  .hero { border-radius:16px; overflow:hidden; }
  .hero-inner { background:linear-gradient(135deg,var(--navy-800),var(--navy-700) 55%,var(--navy-600)); color:#fff; padding:52px 40px; }
  .hero-eyebrow { color:var(--mint-300); font-weight:700; font-size:13px; letter-spacing:.04em; text-transform:uppercase; margin:0 0 12px; }
  .hero-title { font-size:30px; font-weight:800; margin:0 0 16px; line-height:1.35; }
  .hero-sub { color:var(--navy-100); font-size:15px; max-width:620px; margin:0 0 24px; }
  .hero-actions { display:flex; gap:12px; flex-wrap:wrap; }
  .btn-hero-primary { background:var(--mint-500); color:#fff; border:none; border-radius:10px; padding:11px 20px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-hero-primary:hover { background:var(--mint-600); }
  .btn-hero-secondary { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.3); color:#fff; border-radius:10px; padding:11px 20px; font-weight:700; font-size:14px; cursor:pointer; }
  .btn-hero-secondary:hover { background:rgba(255,255,255,.2); }

  @media (max-width:640px){ .hero-inner{ padding:32px 22px; } .hero-title{ font-size:22px; } }

  /* dashboard goal + summary cards */
  .goal-card { display:flex; gap:12px; align-items:flex-start; padding:18px; }
  .goal-num { flex-shrink:0; width:28px; height:28px; border-radius:50%; background:var(--navy-700); color:#fff; font-size:13px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .goal-text { font-size:14px; font-weight:600; color:var(--navy-800); margin:0; }

  .summary-card { padding:18px; }
  .summary-label { font-size:12px; color:var(--slate-400); font-weight:600; margin:0; }
  .summary-value { font-size:21px; font-weight:800; margin:8px 0 0; color:var(--navy-700); }
  .summary-value.mint { color:var(--mint-700); }
  .summary-sub { font-size:11.5px; color:var(--slate-400); margin:4px 0 0; }

  /* investor profile */
  .q-block + .q-block { border-top:1px solid var(--slate-100); margin-top:22px; padding-top:22px; }
  .q-title { font-size:14.5px; font-weight:700; color:var(--navy-800); margin:0 0 12px; }
  .opt-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  @media (max-width:640px){ .opt-grid{ grid-template-columns:1fr; } }
  .opt-btn {
    text-align:left; border:1px solid var(--slate-200); background:#fff; color:var(--slate-600);
    border-radius:10px; padding:10px 14px; font-size:13.5px; cursor:pointer; transition:.15s;
  }
  .opt-btn:hover:not(.selected):not(:disabled) { border-color:var(--navy-300); }
  .opt-btn.selected { border-color:var(--navy-700); background:var(--navy-700); color:#fff; }
  .opt-btn.correct { border-color:var(--mint-500); background:var(--mint-50); color:var(--mint-800); }
  .opt-btn.correct-muted { border-color:var(--mint-200); background:rgba(233,251,246,.6); color:var(--mint-700); }
  .opt-btn.wrong { border-color:var(--orange-500); background:var(--orange-50); color:var(--orange-700); }
  .opt-btn:disabled { cursor:default; }
  .progress-note { font-size:12px; color:var(--slate-400); margin-top:14px; }

  .result-eyebrow { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--mint-600); margin:0; }
  .result-type { font-size:26px; font-weight:800; margin:4px 0 8px; color:var(--navy-900); }
  .result-summary { font-size:14px; color:var(--slate-600); margin:0; }
  ul.plain-list { list-style:none; margin:8px 0 0; padding:0; display:flex; flex-direction:column; gap:6px; }
  ul.plain-list li { display:flex; gap:8px; font-size:13.5px; color:var(--slate-600); }
  .tick { color:var(--mint-500); }
  .warn { color:var(--orange-500); }
  .dot { color:var(--navy-500); }
  .subhead { font-size:13.5px; font-weight:700; color:var(--navy-800); margin:0 0 4px; }

  /* lesson cards */
  .lesson-card { padding:20px; display:flex; flex-direction:column; }
  .lesson-term { font-size:18px; font-weight:800; color:var(--navy-900); margin:0; }
  .lesson-summary { font-size:13.5px; color:var(--slate-600); margin:10px 0 0; }
  .lesson-analogy { margin:12px 0 0; background:var(--slate-50); border-radius:10px; padding:10px 12px; font-size:12.5px; color:var(--slate-500); }
  .lesson-caution { margin:12px 0 0; font-size:12px; font-weight:700; color:var(--orange-600); }
  .lesson-detail { margin-top:14px; border-top:1px solid var(--slate-100); padding-top:14px; font-size:13.5px; line-height:1.7; color:var(--slate-600); }
  .lesson-toggle { margin-top:14px; align-self:flex-start; }

  /* market */
  .stock-pick-card { padding:16px; text-align:left; cursor:pointer; background:#fff; border:1px solid var(--slate-100); border-radius:16px; transition:.15s; }
  .stock-pick-card:hover { box-shadow:0 8px 32px rgba(13,18,38,.14); }
  .stock-pick-card.active { border:2px solid var(--navy-700); box-shadow:0 8px 32px rgba(13,18,38,.14); }
  .stock-pick-name { font-size:14px; font-weight:800; color:var(--navy-900); margin:0; }
  .stock-pick-type { font-size:11.5px; color:var(--slate-400); margin:2px 0 0; }
  .stock-pick-price { font-size:17px; font-weight:800; color:var(--navy-700); margin:8px 0 0; }
  .stock-pick-vol { font-size:11.5px; color:var(--slate-500); margin:4px 0 0; }

  .detail-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; align-items:start; margin-top:20px; }
  @media (max-width:900px){ .detail-grid{ grid-template-columns:1fr; } }
  .stat-row { display:grid; grid-template-columns:repeat(6,1fr); gap:8px; text-align:center; margin:16px 0; }
  @media (max-width:640px){ .stat-row{ grid-template-columns:repeat(3,1fr); } }
  .stat-box { background:var(--slate-50); border-radius:10px; padding:10px 6px; }
  .stat-label { font-size:10.5px; color:var(--slate-400); margin:0; }
  .stat-value { font-size:13.5px; font-weight:800; color:var(--navy-800); margin:4px 0 0; }
  .badge-type { border-radius:999px; background:var(--navy-50); color:var(--navy-700); font-size:11.5px; font-weight:700; padding:4px 12px; }
  .interp-box { background:var(--slate-50); border-radius:10px; padding:12px; font-size:13.5px; color:var(--slate-600); }

  .chart-head { display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
  .fake-data-badge { background:var(--orange-50); color:var(--orange-600); border-radius:999px; padding:4px 12px; font-size:11.5px; font-weight:700; }
  .stock-chart-svg { width:100%; height:260px; display:block; }
  .chart-question-box { margin-top:16px; background:var(--slate-50); border-radius:10px; padding:16px; }
  .chart-feedback { margin-top:12px; font-size:13.5px; color:var(--slate-600); }

  /* portfolio */
  .alloc-row + .alloc-row { margin-top:20px; }
  .alloc-head { display:flex; justify-content:space-between; font-size:13.5px; margin-bottom:6px; }
  .alloc-name { font-weight:700; color:var(--navy-800); }
  .alloc-value { color:var(--navy-700); }
  .alloc-won { font-size:11.5px; color:var(--slate-400); }
  .alloc-controls { display:flex; align-items:center; gap:12px; }
  .alloc-controls input[type=range] { flex:1; height:6px; border-radius:999px; accent-color:var(--navy-700); cursor:pointer; }
  .alloc-controls input[type=number] { width:64px; border:1px solid var(--slate-200); border-radius:8px; padding:6px 8px; font-size:13.5px; }
  .valid-banner { border-radius:10px; padding:11px 16px; font-size:13.5px; font-weight:700; margin-top:22px; }
  .valid-banner.ok { background:var(--mint-50); color:var(--mint-800); }
  .valid-banner.bad { background:var(--orange-50); color:var(--orange-700); }

  .metric-card { padding:18px; }
  .metric-label { font-size:12px; color:var(--slate-400); font-weight:600; margin:0; }
  .metric-value { font-size:24px; font-weight:800; color:var(--navy-800); margin:8px 0 0; }
  .metric-value span { font-size:13px; font-weight:400; color:var(--slate-400); }
  .metric-extra { font-size:12px; font-weight:700; color:var(--orange-600); margin:4px 0 0; }
  .metric-bar-track { height:6px; width:100%; background:var(--slate-100); border-radius:999px; margin-top:12px; }
  .metric-bar-fill { height:6px; background:var(--navy-600); border-radius:999px; }
  .feedback-line { font-size:13.5px; color:var(--slate-600); margin:6px 0; }

  /* checklist */
  .check-item { display:flex; gap:10px; align-items:flex-start; padding:8px; border-radius:10px; cursor:pointer; }
  .check-item:hover { background:var(--slate-50); }
  .check-item input { margin-top:3px; width:16px; height:16px; accent-color:var(--navy-700); }
  .check-item span { font-size:13.5px; color:var(--slate-700); }
  .score-row { display:flex; justify-content:space-between; align-items:center; }
  .score-row .label { font-size:13.5px; font-weight:700; color:var(--navy-800); }
  .score-row .value { font-size:24px; font-weight:800; color:var(--navy-800); }
  .score-bar-track { height:8px; background:var(--slate-100); border-radius:999px; margin-top:12px; }
  .score-bar-fill { height:8px; background:var(--mint-500); border-radius:999px; }
  .tier-feedback { margin-top:16px; font-size:13.5px; font-weight:700; color:var(--navy-700); }

  /* quiz */
  .quiz-card { padding:22px; margin-bottom:16px; }
  .quiz-topic { font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--mint-600); margin:0; }
  .quiz-question { font-size:14px; font-weight:700; color:var(--navy-900); margin:4px 0 0; }
  .quiz-explain { margin-top:12px; background:var(--slate-50); border-radius:10px; padding:12px; font-size:13.5px; color:var(--slate-600); }
  .quiz-summary-score { font-size:30px; font-weight:800; color:var(--navy-900); margin:6px 0 0; }

  /* coach */
  .coach-form { display:flex; gap:8px; }
  .coach-form input { flex:1; border:1px solid var(--slate-200); border-radius:10px; padding:10px 14px; font-size:13.5px; }
  .coach-form input:focus { outline:2px solid var(--navy-300); border-color:var(--navy-300); }
  .example-chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .example-chip { border:1px solid var(--slate-200); background:#fff; border-radius:999px; padding:5px 12px; font-size:12px; color:var(--slate-500); cursor:pointer; }
  .example-chip:hover { border-color:var(--navy-300); color:var(--navy-700); }
  .coach-entry { padding:18px; margin-top:14px; }
  .coach-q { font-size:13.5px; font-weight:700; color:var(--navy-800); margin:0; }
  .coach-a { margin:10px 0 0; font-size:13.5px; line-height:1.7; color:var(--slate-600); white-space:pre-line; }
  .empty-hint { font-size:13.5px; color:var(--slate-400); }

  /* report */
  .report-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
  .report-title { font-size:13.5px; font-weight:700; color:var(--navy-800); margin:0; }
  textarea#report-textarea {
    width:100%; height:420px; resize:none; border:1px solid var(--slate-200); border-radius:10px;
    background:var(--slate-50); padding:16px; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px; line-height:1.7; color:var(--slate-700);
  }

  /* teacher points */
  .teacher-box { border-radius:16px; border:1px solid var(--navy-800); background:var(--navy-900); color:#fff; padding:24px; }
  .teacher-eyebrow { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; color:var(--mint-300); margin:0; }
  .teacher-box ul { list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .teacher-box li { display:flex; gap:8px; font-size:13.5px; color:var(--navy-100); }
  .teacher-arrow { color:var(--mint-400); }

  section.view { display:flex; flex-direction:column; gap:24px; }
</style>
</head>
<body>
<div id="root"></div>

<script>
"use strict";

/* ===================== 1. DATA ===================== */

var MONTHS = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
function toHistory(prices){ return prices.map(function(p,i){ return { month: MONTHS[i], price: p }; }); }

var VIRTUAL_STOCKS = [
  {
    id:"alpha-electronics", name:"Alpha전자", type:"대형 안정주", price:72000, per:12.5, pbr:1.3, roe:10.4,
    dividendYield:2.1, volatility:"낮음", chartPattern:"상승형",
    description:"Alpha전자는 오랜 기간 안정적인 실적을 유지해온 대형 제조업 가상 기업입니다. 시가총액이 크고 사업 구조가 다각화되어 있어 주가 흐름이 비교적 완만한 편입니다.",
    pros:["실적 변동성이 낮아 예측 가능성이 상대적으로 높습니다.","ROE가 10% 내외로 꾸준한 수익성을 유지하고 있습니다.","배당수익률이 있어 장기 보유 시 현금흐름을 기대할 수 있습니다."],
    risks:["이미 시장에서 크게 성장한 기업이라 폭발적인 주가 상승은 기대하기 어렵습니다.","산업 전체가 둔화되면 대형주도 영향을 받을 수 있습니다."],
    studyPoints:["PER 12.5는 업종 평균과 비교했을 때 어떤 수준인지 살펴보는 연습을 해보세요.","낮은 변동성 자산이 포트폴리오에서 어떤 역할을 하는지 생각해보세요."],
    indicatorInterpretation:"PER 12.5, PBR 1.3은 이익과 자산 대비 주가가 과도하게 비싸지 않다는 것을 학습할 수 있는 예시입니다. ROE 10.4%는 자기자본을 효율적으로 활용하고 있음을 보여주는 가상 지표입니다.",
    misconceptions:["\"대형주라서 무조건 안전하다\"는 생각은 위험합니다. 대형주도 하락할 수 있습니다.","낮은 변동성이 손실 가능성이 전혀 없다는 뜻은 아닙니다."],
    priceHistory: toHistory([61000,62500,63200,64800,65100,66700,67900,68200,69500,70100,71000,72000])
  },
  {
    id:"bionext", name:"BioNext", type:"성장주", price:38000, per:48.2, pbr:5.1, roe:4.2,
    dividendYield:0, volatility:"높음", chartPattern:"변동형",
    description:"BioNext는 신약 개발을 테마로 하는 가상 바이오 성장주입니다. 아직 뚜렷한 이익을 내지 못하고 있지만 미래 성장 기대감으로 주가가 크게 움직이는 특징을 보여줍니다.",

function getInvestorType(total){
  if (total <= 9) return "안정형";
  if (total <= 15) return "균형형";
  return "적극형";
}

var RISK_WEIGHT = { largeCap:2, growth:5, dividend:1.5, etf:2.2, cash:0 };
var STABILITY_WEIGHT = { largeCap:3.5, growth:0.5, dividend:4, etf:3, cash:5 };
var GROWTH_WEIGHT = { largeCap:2.5, growth:5, dividend:1.5, etf:3, cash:0 };
var ASSET_KEYS = ["largeCap","growth","dividend","etf","cash"];
var ASSET_LABELS = { largeCap:"대형 안정주", growth:"성장주", dividend:"배당주", etf:"ETF", cash:"현금" };

function weightedScore(allocation, weights){
  var total = ASSET_KEYS.reduce(function(s,k){ return s+allocation[k]; }, 0);
  if (total === 0) return 0;
  var weightedSum = ASSET_KEYS.reduce(function(s,k){ return s+allocation[k]*weights[k]; }, 0);
  return Math.round((weightedSum/(total*5))*100);
}

function calculatePortfolioMetrics(allocation){
  var totalPercent = ASSET_KEYS.reduce(function(s,k){ return s+allocation[k]; }, 0);
  var isValid = totalPercent === 100;
  var riskScore = weightedScore(allocation, RISK_WEIGHT);
  var stability = weightedScore(allocation, STABILITY_WEIGHT);
  var growthPotential = weightedScore(allocation, GROWTH_WEIGHT);
  var dividendExpectation = weightedScore(allocation, { largeCap:2, growth:0, dividend:5, etf:1.5, cash:0 });
  var cashResilience = Math.min(100, Math.round(allocation.cash*1.4 + allocation.dividend*0.3));
  var maxAllocation = Math.max.apply(null, ASSET_KEYS.map(function(k){ return allocation[k]; }));
  var nonZeroCount = ASSET_KEYS.filter(function(k){ return allocation[k] > 0; }).length;
  var diversificationScore = Math.max(0, Math.round(100 - maxAllocation*0.8 + (nonZeroCount-1)*5));
  var concentratedAsset = null;
  for (var i=0;i<ASSET_KEYS.length;i++){ if (allocation[ASSET_KEYS[i]] >= 60){ concentratedAsset = ASSET_KEYS[i]; break; } }
  var riskLevel = "중간";
  if (riskScore < 35) riskLevel = "낮음"; else if (riskScore > 65) riskLevel = "높음";
  return { totalPercent:totalPercent, isValid:isValid, riskScore:riskScore, riskLevel:riskLevel, stability:stability,
    growthPotential:growthPotential, cashResilience:cashResilience, dividendExpectation:dividendExpectation,
    diversificationScore:Math.min(100,diversificationScore), concentratedAsset:concentratedAsset };
}

function esc(str){

}

function buildLineChartSVG(data){
  var width=600, height=260, padLeft=44, padRight=16, padTop=14, padBottom=26;
  var values = data.map(function(d){ return d.price; });
  var minV = Math.min.apply(null, values), maxV = Math.max.apply(null, values);
  var rangePad = (maxV-minV)*0.18 || maxV*0.1;
  var yMin = Math.max(0, minV-rangePad), yMax = maxV+rangePad;
  var innerW = width-padLeft-padRight, innerH = height-padTop-padBottom;
  var stepX = innerW/(data.length-1);
  var pts = data.map(function(d,i){
    var x = padLeft+i*stepX;
    var y = padTop+innerH-((d.price-yMin)/(yMax-yMin))*innerH;
    return {x:x,y:y};
  });
  var pathD = pts.map(function(p,i){ return (i===0?"M":"L")+p.x.toFixed(1)+","+p.y.toFixed(1); }).join(" ");
  var ticks=4, gridLines="", yLabels="";
  for (var i=0;i<=ticks;i++){
    var v = yMin+(yMax-yMin)*i/ticks;
    var y = padTop+innerH-(i/ticks)*innerH;
    gridLines += '<line x1="'+padLeft+'" y1="'+y.toFixed(1)+'" x2="'+(width-padRight)+'" y2="'+y.toFixed(1)+'" stroke="#e2e8f0" stroke-width="1"/>';
    yLabels += '<text x="'+(padLeft-8)+'" y="'+(y+4).toFixed(1)+'" font-size="11" fill="#64748b" text-anchor="end">'+Math.round(v/1000)+'k</text>';
  }
  var xLabels = "";
  data.forEach(function(d,i){
    var x = padLeft+i*stepX;
    xLabels += '<text x="'+x.toFixed(1)+'" y="'+(height-6)+'" font-size="10" fill="#64748b" text-anchor="middle">'+d.month+'</text>';
  });
  var dots = pts.map(function(p){ return '<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="2.5" fill="#1fb28c" />'; }).join("");
  return '<svg viewBox="0 0 '+width+' '+height+'" class="stock-chart-svg" preserveAspectRatio="xMidYMid meet">'
    + gridLines + yLabels + xLabels
    + '<path d="'+pathD+'" fill="none" stroke="#1fb28c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + dots
    + '</svg>';
}

function quizOptionClass(qIndex, optIndex){
  var selected = state.quizAnswers[qIndex];
  var answered = selected !== null;
  var isCorrect = optIndex === QUIZ_QUESTIONS[qIndex].answerIndex;
  var isSelected = selected === optIndex;
  if (!answered) return "opt-btn";
  if (isSelected && isCorrect) return "opt-btn correct";

  if (isCorrect) return "opt-btn correct-muted";
  return "opt-btn";
}

    var result = getInvestorProfileResult(currentInvestorType());
    lines.push("유형: " + currentInvestorType());
    lines.push(result.summary);
  } else {
    lines.push("아직 투자 성향 진단을 완료하지 않았습니다.");
  }
  lines.push("");
  lines.push("[현재 모의 포트폴리오 특징]");
  var pm = calculatePortfolioMetrics(state.allocation);
  if (state.portfolioTouched){
    var allocText = ASSET_KEYS.map(function(k){ return ASSET_LABELS[k]+" "+state.allocation[k]+"%"; }).join(", ");
    lines.push("배분: " + allocText);
    lines.push("위험도 " + pm.riskLevel + "(" + pm.riskScore + "/100), 분산투자 점수 " + pm.diversificationScore + "/100");
  } else {
    lines.push("아직 모의 포트폴리오를 구성하지 않았습니다.");
  }
  lines.push("");
  lines.push("[강점]");
  if (profileCompleted()){
    getInvestorProfileResult(currentInvestorType()).strengths.forEach(function(s){ lines.push("- " + s); });
  } else {
    lines.push("- 진단 완료 후 확인 가능합니다.");
  }
  lines.push("");
  lines.push("[주의할 점]");
  if (profileCompleted()){
    getInvestorProfileResult(currentInvestorType()).cautions.forEach(function(c){ lines.push("- " + c); });
  }
  if (state.portfolioTouched && pm.concentratedAsset){
    lines.push("- 특정 자산에 60% 이상 집중되어 있어 리스크가 커질 수 있습니다.");
  }
  lines.push("- 체크리스트 " + checklistScore() + "/10 (" + getChecklistTier(checklistScore()) + "), 퀴즈 " + (quizCompletedFn() ? (quizScoreFn()+"/7 ("+getQuizTier(quizScoreFn())+")") : "미응시"));
  lines.push("");
  lines.push("[더 공부해야 할 개념]");
  if (profileCompleted()){
    getInvestorProfileResult(currentInvestorType()).studyDirection.forEach(function(s){ lines.push("- " + s); });
  } else {
    lines.push("- PER, PBR, ROE, 분산투자, 리스크 관리 기본 개념");
  }
  lines.push("");
  lines.push("[다음 학습 과제 3가지]");
  lines.push("1. 가상 종목 5개의 재무지표를 비교하고 차이를 설명해보기");
  lines.push("2. 포트폴리오 배분을 바꿔가며 위험도와 분산투자 점수 변화 관찰하기");
  lines.push("3. 초보자 퀴즈를 다시 풀어 취약한 개념 점검하기");
  lines.push("");
  lines.push("[교육용 안내]");
  lines.push("본 리포트는 투자 권유가 아니라 학습 진행 상황을 정리한 교육용 시뮬레이션 결과입니다. 실제 투자 판단은 본인의 책임으로 충분히 검토해야 합니다.");
  return lines.join("\n");
}
function renderReport(){
  return '<section class="view">'
    + '<div><h2 class="section-title">월간 학습 리포트</h2><p class="section-desc">진단 결과, 포트폴리오 구성, 체크리스트, 퀴즈 점수를 바탕으로 학습 리포트를 자동 생성합니다.</p></div>'
    + '<div class="card card-pad">'
    + '<div class="report-head"><p class="report-title">리포트 (복사 가능)</p><button class="btn-secondary" id="copy-report-btn">텍스트 복사하기</button></div>'
    + '<textarea id="report-textarea" readonly>'+esc(buildReportText())+'</textarea>'
    + '</div>'
    + '<div class="disclaimer">본 프로그램은 투자 권유가 아니라 교육용 시뮬레이션입니다. 리포트에 포함된 모든 데이터는 브라우저 내에서만 계산되며 저장되지 않습니다.</div>'
    + '</section>';
}
function bindReport(root){
  var btn = root.querySelector("#copy-report-btn");
  btn.addEventListener("click", function(){
    var ta = document.getElementById("report-textarea");
    var text = ta.value;
    function done(ok){ btn.textContent = ok ? "복사됨 ✓" : "복사 실패"; setTimeout(function(){ btn.textContent = "텍스트 복사하기"; }, 2000); }
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(function(){ done(true); }).catch(function(){ fallbackCopy(ta, done); });
    } else {
      fallbackCopy(ta, done);
    }
  });
}
function fallbackCopy(ta, done){
  try {
    ta.removeAttribute("readonly");
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    var ok = document.execCommand("copy");
    ta.setAttribute("readonly","");
    done(ok);
  } catch (e){ done(false); }
}

/* ===================== 7. NAV / APP SHELL ===================== */

var NAV_ITEMS = [
  { id:"dashboard", label:"대시보드" },
  { id:"profile", label:"투자 성향 진단" },
  { id:"lessons", label:"기초 학습 카드" },
  { id:"market", label:"가상 종목 · 차트" },
  { id:"portfolio", label:"포트폴리오 시뮬레이터" },
  { id:"checklist", label:"투자 체크리스트" },
  { id:"quiz", label:"초보자 퀴즈" },
  { id:"coach", label:"AI 학습 코치" },
  { id:"report", label:"월간 리포트" }
];

function renderShell(){
  var root = document.getElementById("root");
  root.innerHTML =
    '<header class="app-header"><div class="container">'
    + '<div class="header-top"><div class="logo-box"><svg width="18" height="18" viewBox="0 0 32 32" fill="none">'
    + '<path d="M6 21L12 14L17 18L26 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>'
    + '<path d="M20 8H26V14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>'
    + '<div><p class="brand-title">AI 주식 투자 학습 코치</p><p class="brand-sub">교육용 모의투자 시뮬레이션</p></div></div>'
    + '<nav class="app-nav" id="app-nav">' + NAV_ITEMS.map(function(it){ return '<button data-nav="'+it.id+'">'+it.label+'</button>'; }).join("") + '</nav>'
    + '</div><div class="disclaimer-bar">⚠ '+EDU_DISCLAIMER+' 모든 종목·가격·수익률은 가상 데이터입니다.</div></header>'
    + '<main id="main-content"></main>'
    + '<footer class="app-footer">' + teacherPointsHTML() + '</footer>';

  document.querySelectorAll("#app-nav [data-nav]").forEach(function(btn){
    btn.addEventListener("click", function(){ navigate(btn.getAttribute("data-nav")); });
  });
}

function updateNavActive(){
  document.querySelectorAll("#app-nav [data-nav]").forEach(function(btn){
    btn.classList.toggle("active", btn.getAttribute("data-nav") === state.section);
  });
}

function renderSection(){
  var main = document.getElementById("main-content");
  var section = state.section;
  if (section === "dashboard"){ main.innerHTML = renderDashboard(); bindDashboard(main); }
  else if (section === "profile"){ main.innerHTML = renderProfile(); bindProfile(main); }
  else if (section === "lessons"){ main.innerHTML = renderLessons(); bindLessons(main); }
  else if (section === "market"){ main.innerHTML = renderMarket(); bindMarket(main); }
  else if (section === "portfolio"){ main.innerHTML = renderPortfolio(); bindPortfolio(main); }
  else if (section === "checklist"){ main.innerHTML = renderChecklist(); bindChecklist(main); }
  else if (section === "quiz"){ main.innerHTML = renderQuiz(); bindQuiz(main); }
  else if (section === "coach"){ main.innerHTML = renderCoach(); bindCoach(main); }
  else if (section === "report"){ main.innerHTML = renderReport(); bindReport(main); }
  updateNavActive();
}

function navigate(section){
  state.section = section;
  renderSection();
  window.scrollTo(0,0);
}

renderShell();
navigate("dashboard");

</script>
