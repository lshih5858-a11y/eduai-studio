ons:[{number:1,text:"무형성"},{number:2,text:"이질성"},{number:3,text:"소멸성"},{number:4,text:"대량생산성"}],answer:"4",explanation:"서비스의 4대 특성은 무형성, 이질성(이변성), 소멸성, 동시성(비분리성)입니다. 대량생산성은 제품의 특성입니다."},{id:"q1-3",week:1,type:"단답형",question:"서비스가 재고로 저장될 수 없으며 생산된 즉시 소멸되는 특성을 무엇이라 하는가?",answer:"소멸성 (또는 재고불가능성)",explanation:"소멸성(Perishability)은 서비스를 미리 생산해서 저장하거나 재고로 보관할 수 없는 특성을 말합니다. 항공좌석, 호텔객실이 대표적 예입니다."},{id:"q1-4",week:1,type:"OX",question:"서비스는 표준화하기 어렵고 서비스 제공자에 따라 품질이 달라질 수 있는데, 이를 이질성이라 한다.",answer:"O",explanation:"이질성(Heterogeneity)은 서비스 품질이 제공자, 고객, 시간, 장소에 따라 달라지는 특성입니다."},{id:"q2-1",week:2,type:"객관식",question:"SERVQUAL의 5가지 차원에 해당하지 않는 것은?",options:[{number:1,text:"유형성"},{number:2,text:"신뢰성"},{number:3,text:"응답성"},{number:4,text:"생산성"}],answer:"4",explanation:"SERVQUAL의 5가지 차원은 유형성(Tangibles), 신뢰성(Reliability), 응답성(Responsiveness), 확신성(Assurance), 공감성(Empathy)입니다."},{id:"q2-2",week:2,type:"OX",question:"SERVQUAL 모델에서 갭(Gap)이 작을수록 고객 만족도가 높다.",answer:"O",explanation:"갭은 고객이 기대하는 서비스 수준과 실제로 인식한 서비스 수준의 차이입니다. 갭이 작을수록 고객 만족도가 높아집니다."},{id:"q2-3",week:2,type:"사례형",question:"한 병원 환자가 '의사 선생님이 내 이야기를 잘 들어주지 않는 것 같아 불만이다'라고 했습니다. 이는 SERVQUAL의 어느 차원이 낮게 평가된 것인가?",answer:"공감성(Empathy) — 의료진이 환자의 감정과 요구를 개별적으로 이해하고 배려하는 수준이 낮음을 의미합니다.",explanation:"공감성(Empathy)은 서비스 제공자가 고객의 입장에서 개인적 관심과 배려를 보여주는 것을 말합니다."},{id:"q2-4",week:2,type:"단답형",question:"서비스 제공 직원의 지식, 예의, 신뢰감을 나타내는 SERVQUAL 차원은?",answer:"확신성(Assurance)",explanation:"확신성은 직원의 전문성, 정중함, 고객에게 믿음과 자신감을 심어주는 능력을 의미합니다."},{id:"q3-1",week:3,type:"객관식",question:"고객여정맵에서 고객이 브랜드 또는 서비스와 상호작용하는 모든 접점을 무엇이라 하는가?",options:[{number:1,text:"페인포인트"},{number:2,text:"터치포인트"},{number:3,text:"채널포인트"},{number:4,text:"서비스포인트"}],answer:"2",explanation:"터치포인트(Touchpoint)는 고객이 기업, 제품, 서비스와 직접 상호작용하는 모든 접점을 의미합니다."},{id:"q3-2",week:3,type:"OX",question:"페인포인트(Pain Point)는 고객이 서비스 이용 과정에서 느끼는 불편함이나 불만 지점을 말한다.",answer:"O",explanation:"페인포인트는 고객이 서비스 여정 중에 겪는 어려움, 불편함, 불만족 요소입니다."},{id:"q3-3",week:3,type:"단답형",question:"고객여정맵에서 고객의 여정을 시작하기 전 가장 먼저 설정해야 하는 것은 무엇인가?",answer:"고객 페르소나(Persona) — 목표 고객의 특성, 행동, 동기, 불만을 구체화한 가상 인물",explanation:"페르소나를 먼저 설정하면 여정 분석 시 고객 입장에서 일관성 있는 시각을 유지할 수 있습니다."},{id:"q3-4",week:3,type:"사례형",question:"카페를 처음 방문하는 고객의 여정을 단계별로 나열하고, 각 단계에서 발생할 수 있는 페인포인트를 1가지씩 제시하시오.",answer:"인지(SNS 광고 → 정보 부족) → 탐색(리뷰 검색 → 정보 불일치) → 방문(주문 대기 → 긴 대기시간) → 이용(자리 부족) → 사후(포인트 적립 어려움)",explanation:"고객여정은 인지-탐색-구매-이용-사후관리 단계로 나뉘며 각 단계에서 고객의 기대와 실제 경험 사이의 간극을 파악하는 것이 핵심입니다."},{id:"q4-1",week:4,type:"객관식",question:"서비스 블루프린트에서 고객에게 직접 보이는 직원 활동 영역은?",options:[{number:1,text:"후방 활동"},{number:2,text:"지원 프로세스"},{number:3,text:"전면 활동"},{number:4,text:"내부 프로세스"}],answer:"3",explanation:"전면 활동(Front-Stage Activities)은 고객에게 보이는 서비스 접점에서의 직원 활동입니다."},{id:"q4-2",week:4,type:"단답형",question:"디자인씽킹의 5단계를 순서대로 나열하시오.",answer:"공감(Empathize) → 문제 정의(Define) → 아이디어화(Ideate) → 프로토타입(Prototype) → 테스트(Test)",explanation:"디자인씽킹은 인간 중심 문제해결 방법론으로, 공감에서 시작하여 반복적인 프로토타이핑과 테스트를 통해 해결책을 도출합니다."},{id:"q4-3",week:4,type:"OX",question:"서비스 블루프린트에서 '가시선(Line of Visibility)'은 고객에게 보이는 활동과 보이지 않는 활동을 구분하는 경계선이다.",answer:"O",explanation:"가시선(Line of Visibility)은 서비스 블루프린트에서 전면(Front-Stage)과 후방(Back-Stage) 활동을 구분하는 수평선입니다."},{id:"q4-4",week:4,type:"사례형",question:"레스토랑 서비스를 서비스 블루프린트로 간략히 표현하시오. 전면 활동 2가지와 후방 활동 2가지를 포함하시오.",answer:"전면: 예약 접수, 주문 받기 / 후방: 음식 조리, 식재료 관리 / 지원: POS 시스템, 예약 시스템",explanation:"서비스 블루프린트는 고객 여정을 중심으로 전면·후방·지원 활동을 구조화하여 서비스 전체 흐름을 시각화합니다."},{id:"q5-1",week:5,type:"객관식",question:"서비스 운영에서 수요가 공급 능력을 초과하는 상황에서 가장 적합한 전략은?",options:[{number:1,text:"직원 수 즉시 감소"},{number:2,text:"예약 시스템 도입"},{number:3,text:"가격 인상 금지"},{number:4,text:"서비스 중단"}],answer:"2",explanation:"수요 초과 시 예약 시스템을 도입하면 수요를 분산시키고 서비스 품질을 유지할 수 있습니다."},{id:"q5-2",week:5,type:"OX",question:"대기행렬 이론에서 평균 대기시간은 서비스 이용률이 높아질수록 증가한다.",answer:"O",explanation:"서비스 이용률이 높아질수록 대기행렬이 길어지고 평균 대기시간도 크게 증가합니다."},{id:"q5-3",week:5,type:"단답형",question:"수요-공급 관리에서 성수기와 비수기의 가격을 다르게 책정하는 전략을 무엇이라 하는가?",answer:"수율 관리(Yield Management) 또는 동적 가격 책정(Dynamic Pricing)",explanation:"수율 관리는 항공, 호텔 등에서 시간/수요에 따라 가격을 조정하여 수익을 극대화하는 전략입니다."},{id:"q5-4",week:5,type:"사례형",question:"패스트푸드점에서 점심시간에 긴 줄이 생기는 문제를 해결하기 위한 대기시간 관리 전략 3가지를 제안하시오.",answer:"① 키오스크 도입으로 주문 채널 분산 ② 사전 모바일 앱 주문 시스템 운영 ③ 메뉴 단순화로 조리 시간 단축 또는 피크 시간 대 인력 증원",explanation:"대기시간 관리는 수요 분산, 공급 능력 향상, 인식된 대기시간 축소 세 가지 방향으로 접근할 수 있습니다."},{id:"q6-1",week:6,type:"객관식",question:"내부마케팅(Internal Marketing)의 주요 목적은?",options:[{number:1,text:"내부 직원을 대상으로 회사 제품 판매"},{number:2,text:"직원을 내부 고객으로 보고 만족도를 높여 서비스 품질 향상"},{number:3,text:"마케팅 비용 절감"},{number:4,text:"외부 광고 효율 극대화"}],answer:"2",explanation:"내부마케팅은 직원을 '내부 고객'으로 바라보고 만족도를 높임으로써 외부 고객 서비스 품질이 향상된다는 개념입니다."},{id:"q6-2",week:6,type:"사례형",question:"콜센터 상담원이 매일 불만 고객 응대로 극도의 피로감과 스트레스를 호소합니다. 서비스경영 관점에서 기업이 취해야 할 조치를 3가지 제안하시오.",answer:"① 정기적 심리상담 프로그램 제공 ② 응대 건수 조정 및 충분한 휴식 보장 ③ 불합리한 고객 응대 거부권 및 에스컬레이션 프로세스 구축",explanation:"감정노동 관리는 직원 보호 정책과 지원 시스템을 통해 서비스 품질과 직원 만족도를 동시에 높이는 방향으로 접근해야 합니다."},{id:"q6-3",week:6,type:"OX",question:"서비스-이익 체인(Service-Profit Chain)에서 직원 만족도가 높아지면 고객 만족도도 높아진다.",answer:"O",explanation:"서비스-이익 체인은 직원 만족 → 서비스 품질 향상 → 고객 만족 → 고객 충성도 → 수익 증대의 선순환을 설명합니다."},{id:"q6-4",week:6,type:"단답형",question:"서비스 직원이 직업상 필요한 감정 표현을 요구받을 때 발생하는 심리적 부담을 무엇이라 하는가?",answer:"감정노동(Emotional Labor)",explanation:"감정노동은 Hochschild(1983)가 제시한 개념으로, 직업 수행을 위해 실제 감정을 억누르거나 특정 감정을 표현해야 하는 노동을 말합니다."},{id:"q7-1",week:7,type:"객관식",question:"서비스 마케팅 믹스 7P에서 제품·가격·유통·촉진 외에 서비스 고유의 3P가 아닌 것은?",options:[{number:1,text:"People(사람)"},{number:2,text:"Process(프로세스)"},{number:3,text:"Physical Evidence(물리적 증거)"},{number:4,text:"Partnership(파트너십)"}],answer:"4",explanation:"서비스 마케팅에 추가된 3P는 People(사람), Process(프로세스), Physical Evidence(물리적 증거)입니다."},{id:"q7-2",week:7,type:"OX",question:"서비스의 Physical Evidence(물리적 증거)는 서비스 품질에 대한 고객의 인식에 영향을 미친다.",answer:"O",explanation:"무형적인 서비스를 평가할 때 고객은 물리적 환경(인테리어, 직원 복장, 장비, 청결도 등)을 품질 판단의 단서로 활용합니다."},{id:"q7-3",week:7,type:"단답형",question:"서비스 마케팅에서 고객과의 장기적 관계 구축을 통해 고객 충성도를 높이는 마케팅 방식은?",answer:"관계 마케팅(Relationship Marketing)",explanation:"관계 마케팅은 신규 고객 획득보다 기존 고객 유지에 집중하여 장기적 수익을 극대화하는 전략입니다."},{id:"q7-4",week:7,type:"사례형",question:"스타벅스의 7P 전략을 간략히 분석하시오. 특히 People, Process, Physical Evidence에 중점을 두시오.",answer:"People: 바리스타 교육·파트너 문화 / Process: 주문 표준화, 모바일 사이렌오더 / Physical Evidence: 매장 인테리어, 초록 컵, 아늑한 분위기",explanation:"스타벅스는 7P 중 특히 사람, 프로세스, 물리적 증거를 핵심 경쟁우위로 활용합니다."},{id:"q8-1",week:8,type:"객관식",question:"다음 중 서비스 품질 갭 모델에서 '고객의 기대'와 '경영진의 고객 기대 인식' 사이의 차이를 나타내는 갭은?",options:[{number:1,text:"갭 1 (지식 갭)"},{number:2,text:"갭 2 (표준 갭)"},{number:3,text:"갭 3 (전달 갭)"},{number:4,text:"갭 5 (인식 갭)"}],answer:"1",explanation:"갭 1(지식 갭)은 경영진이 고객의 기대를 정확히 이해하지 못할 때 발생합니다."},{id:"q8-2",week:8,type:"OX",question:"서비스 마케팅의 7P 중 Process는 서비스 제공자가 아닌 고객의 행동을 의미한다.",answer:"X",explanation:"Process(프로세스)는 서비스가 제공되는 절차, 방법, 시스템을 의미합니다. 고객의 행동은 포함될 수 있지만 주 초점은 서비스 전달 과정입니다."},{id:"q8-3",week:8,type:"단답형",question:"1~7주차에서 배운 개념 중 '고객의 눈에 보이지 않지만 서비스 품질에 결정적 영향을 미치는 후방 운영 활동'을 나타내는 서비스 설계 도구는?",answer:"서비스 블루프린트(Service Blueprint)",explanation:"서비스 블루프린트는 전면·후방 활동과 지원 프로세스를 한눈에 파악할 수 있어 서비스 설계와 개선에 핵심적인 도구입니다."},{id:"q8-4",week:8,type:"사례형",question:"1~7주차에서 학습한 SERVQUAL, 고객여정맵, 서비스 블루프린트, 7P 전략 중 병원 서비스 개선에 가장 적합한 도구를 선택하고 이유를 설명하시오.",answer:"자유 서술 (예: SERVQUAL — 환자가 기대하는 의료 서비스 품질 차원을 진단하여 우선 개선 영역을 파악할 수 있기 때문)",explanation:"복합적인 서비스 개선 상황에서는 단일 도구보다 여러 도구를 조합하는 것이 효과적이며, 각 도구의 특성과 목적을 이해하는 것이 중요합니다."},{id:"q9-1",week:9,type:"객관식",question:"기업이 온라인과 오프라인 채널을 통합하여 일관된 고객 경험을 제공하는 전략은?",options:[{number:1,text:"멀티채널 전략"},{number:2,text:"옴니채널 전략"},{number:3,text:"크로스채널 전략"},{number:4,text:"단일채널 전략"}],answer:"2",explanation:"옴니채널(Omnichannel) 전략은 온/오프라인 모든 채널에서 일관되고 통합된 고객 경험을 제공합니다."},{id:"q9-2",week:9,type:"OX",question:"AI 챗봇의 도입은 24시간 고객 서비스 제공을 가능하게 하여 서비스 접근성을 높인다.",answer:"O",explanation:"AI 챗봇은 24시간 서비스 제공, 빠른 응답이라는 장점이 있지만 복잡한 문제 해결에는 한계가 있어 인간 상담원과의 연계가 필요합니다."},{id:"q9-3",week:9,type:"단답형",question:"디지털 기술을 활용하여 기업의 전통적인 비즈니스 모델, 프로세스, 고객 경험을 혁신하는 것을 무엇이라 하는가?",answer:"디지털 전환(Digital Transformation, DX)",explanation:"디지털 전환은 단순한 IT 도입을 넘어 비즈니스 전략, 조직 문화, 고객 경험 전반을 디지털 중심으로 재구성하는 변화입니다."},{id:"q9-4",week:9,type:"사례형",question:"은행 서비스에서 AI가 적용된 사례를 2가지 들고, 각 사례의 장점과 한계점을 설명하시오.",answer:"① AI 챗봇 상담 - 24시간 신속 응대(장점) vs 복잡한 금융 상담 한계(한계) ② AI 신용평가 - 빠른 대출 심사(장점) vs 알고리즘 편향성 우려(한계)",explanation:"AI 서비스 적용은 효율성과 비용 절감 이점이 있지만, 개인정보 보호, 알고리즘 공정성, 디지털 소외 계층 문제도 고려해야 합니다."},{id:"q10-1",week:10,type:"객관식",question:"고객이 서비스를 처음 이용한 시점부터 관계가 끝날 때까지 발생하는 총 수익의 현재가치는?",options:[{number:1,text:"CAC (고객획득비용)"},{number:2,text:"LTV (고객생애가치)"},{number:3,text:"NPS (순추천지수)"},{number:4,text:"ARPU (사용자당 평균 매출)"}],answer:"2",explanation:"LTV(Lifetime Value, 고객생애가치)는 한 고객이 기업과의 관계에서 전체 기간 동안 가져다주는 순수익의 현재가치입니다."},{id:"q10-2",week:10,type:"OX",question:"구독 모델(Subscription Model)은 안정적인 반복 매출을 확보할 수 있어 서비스 기업의 수익 예측 가능성을 높인다.",answer:"O",explanation:"구독 모델은 정기적인 요금 수취로 매출 안정성을 높이고, 고객 데이터 축적을 통한 서비스 개선 기회를 제공합니다."},{id:"q10-3",week:10,type:"단답형",question:"신규 고객 1명을 획득하는 데 드는 비용을 나타내는 지표를 무엇이라 하는가?",answer:"CAC (Customer Acquisition Cost, 고객 획득 비용)",explanation:"LTV/CAC 비율이 3 이상이면 비즈니스 모델이 지속 가능하다고 봅니다. 즉, LTV가 CAC의 3배 이상이어야 합니다."},{id:"q10-4",week:10,type:"사례형",question:"넷플릭스의 수익 모델을 분석하고, 구독 모델이 성공할 수 있었던 핵심 요인 3가지를 설명하시오.",answer:"① 콘텐츠 다양성 — 방대한 라이브러리로 높은 구독 유지율 ② 개인화 추천 알고리즘 — AI 기반 콘텐츠 추천으로 이탈 방지 ③ 가격 탄력성 — 다양한 요금제로 폭넓은 고객층 확보",explanation:"구독 모델의 성공은 단순히 가격 전략이 아닌 콘텐츠 가치, 개인화 경험, 전환 비용(Lock-in) 등 복합적 요인에 달려 있습니다."},{id:"q11-1",week:11,type:"사례형",question:"고객이 서비스 실패로 강하게 항의할 때 가장 먼저 해야 할 대응은? 그 이유와 함께 설명하시오.",answer:"고객 감정 인정과 진정성 있는 사과 — 방어적 반응보다 공감적 사과가 고객의 분노를 완화하고 문제 해결로 나아갈 수 있게 합니다.",explanation:"서비스 회복 연구에 따르면 신속하고 진정성 있는 사과는 고객 만족 회복에 가장 효과적입니다."},{id:"q11-2",week:11,type:"객관식",question:"서비스 회복 공정성의 세 가지 유형이 아닌 것은?",options:[{number:1,text:"결과 공정성"},{number:2,text:"절차 공정성"},{number:3,text:"상호작용 공정성"},{number:4,text:"시간 공정성"}],answer:"4",explanation:"서비스 회복 공정성의 3가지 유형은 결과 공정성(보상 수준), 절차 공정성(처리 과정), 상호작용 공정성(직원 태도)입니다."},{id:"q11-3",week:11,type:"OX",question:"서비스 실패 후 효과적으로 회복된 경우, 오히려 처음부터 문제가 없었던 경우보다 고객 만족도가 높아지는 현상을 '서비스 회복 역설'이라 한다.",answer:"O",explanation:"서비스 회복 역설(Service Recovery Paradox)은 탁월한 회복이 이루어졌을 때 고객 만족과 충성도가 오히려 증가하는 현상입니다."},{id:"q11-4",week:11,type:"단답형",question:"서비스 실패의 유형 중, 서비스 자체의 결함이나 오류(예: 음식 이물질, 오배송)에 해당하는 유형은?",answer:"서비스 제공 실패 (Service Delivery Failure) 또는 결과 실패",explanation:"서비스 실패는 크게 서비스 제공 실패(결과 실패), 고객 요청 미응답, 직원의 자발적 행동 실패로 분류됩니다."},{id:"q12-1",week:12,type:"객관식",question:"글로벌 서비스 전략에서 현지 문화와 고객 특성에 맞게 서비스를 조정하는 접근방식은?",options:[{number:1,text:"표준화 전략"},{number:2,text:"현지화 전략"},{number:3,text:"글로벌화 전략"},{number:4,text:"통합화 전략"}],answer:"2",explanation:"현지화(Localization) 전략은 현지 문화, 소비자 선호, 규제에 맞게 서비스를 조정하는 접근방식입니다."},{id:"q12-2",week:12,type:"OX",question:"표준화 전략은 전 세계에 동일한 서비스를 제공하여 규모의 경제를 달성하려는 전략이다.",answer:"O",explanation:"표준화 전략은 일관된 브랜드 이미지와 비용 효율성을 확보하지만, 문화적 차이를 고려하지 못하는 단점이 있습니다."},{id:"q12-3",week:12,type:"단답형",question:"호프스테드(Hofstede)의 문화 차원 모델에서 권력 차이에 대한 수용도를 나타내는 차원은?",answer:"권력 거리(Power Distance)",explanation:"권력 거리가 높은 문화(한국, 중국)에서는 서비스 제공 시 위계와 공손함이 중요하고, 낮은 문화(미국, 스웨덴)에서는 평등한 관계가 선호됩니다."},{id:"q12-4",week:12,type:"사례형",question:"맥도날드가 인도 시장에서 현지화 전략을 적용한 사례를 설명하고, 이것이 성공한 이유를 분석하시오.",answer:"인도의 종교적·문화적 특성(힌두교의 소고기 금지, 채식주의)을 반영하여 맥알루티키(감자 패티 버거), 채식 메뉴를 도입하고, 매운 맛 선호에 맞춘 소스를 개발한 것이 현지화 성공 요인.",explanation:"현지화 전략의 핵심은 문화적 민감성을 존중하면서 글로벌 브랜드 정체성을 유지하는 균형입니다."},{id:"q13-1",week:13,type:"객관식",question:"ESG 경영에서 'G'가 나타내는 것은?",options:[{number:1,text:"글로벌화(Globalization)"},{number:2,text:"성장(Growth)"},{number:3,text:"거버넌스(Governance)"},{number:4,text:"공익(Good)"}],answer:"3",explanation:"ESG는 Environmental(환경), Social(사회), Governance(지배구조/거버넌스)의 약자입니다."},{id:"q13-2",week:13,type:"OX",question:"CSR(기업사회책임)과 ESG는 동일한 개념으로 구별 없이 사용할 수 있다.",answer:"X",explanation:"CSR은 기업의 사회적 의무와 자선 활동 중심이라면, ESG는 투자자 관점에서 기업의 지속가능성을 정량적으로 측정하는 개념입니다."},{id:"q13-3",week:13,type:"단답형",question:"서비스 기업이 환경(E) 측면에서 실천할 수 있는 구체적인 활동을 3가지 서술하시오.",answer:"① 종이 영수증 전자화 ② 매장 에너지 절감(LED 조명, 재생에너지) ③ 친환경 포장재 사용 또는 일회용품 감소",explanation:"서비스 기업의 ESG 환경 활동은 에너지 사용, 폐기물 관리, 탄소 배출 감소를 중심으로 실천됩니다."},{id:"q13-4",week:13,type:"사례형",question:"파타고니아(Patagonia)의 ESG 경영 사례를 분석하고, 이것이 서비스경영에 주는 시사점을 설명하시오.",answer:"파타고니아는 환경 보호 미션을 핵심 비즈니스 전략으로 삼아 수익 일부를 환경 단체에 기부하고, 제품 수리 서비스를 무상 제공함. 시사점: ESG 가치를 진정성 있게 실천할 때 브랜드 충성도와 프리미엄 가격 유지가 가능함.",explanation:"소비자들이 기업의 사회적 책임에 주목하는 시대에 ESG는 비용이 아닌 경쟁우위의 원천이 될 수 있습니다."},{id:"q14-1",week:14,type:"객관식",question:"기존 서비스의 점진적 개선이 아닌, 완전히 새로운 가치를 창출하는 혁신 유형은?",options:[{number:1,text:"점진적 혁신"},{number:2,text:"급진적 혁신"},{number:3,text:"지속적 개선"},{number:4,text:"프로세스 최적화"}],answer:"2",explanation:"급진적 혁신(Radical Innovation)은 기존 시장을 파괴하거나 완전히 새로운 시장을 창출하는 혁신으로, 에어비앤비나 우버가 대표적 사례입니다."},{id:"q14-2",week:14,type:"OX",question:"디자인씽킹에서 프로토타입 단계는 완성된 결과물을 만드는 것이 목적이다.",answer:"X",explanation:"프로토타입 단계는 빠르고 저렴하게 아이디어를 구현해보는 것이 목적입니다. 완성도보다는 빠른 피드백 수집이 핵심입니다."},{id:"q14-3",week:14,type:"단답형",question:"서비스 혁신 아이디어 도출 방법 중, 다양한 아이디어를 빠르게 발산하고 비판 없이 수용하는 기법을 무엇이라 하는가?",answer:"브레인스토밍(Brainstorming)",explanation:"브레인스토밍은 Osborn(1953)이 개발한 집단 창의성 기법으로, 아이디어 발산 단계에서 평가를 보류하고 양적으로 많은 아이디어를 생성합니다."},{id:"q14-4",week:14,type:"사례형",question:"에어비앤비(Airbnb)가 기존 호텔 산업을 혁신한 방식을 서비스 혁신 관점에서 분석하고, 핵심 성공 요인 3가지를 제시하시오.",answer:"① 플랫폼 비즈니스 모델 — 공급자(호스트)와 수요자(게스트)를 연결하는 양면 시장 ② 공유경제 활용 — 유휴 자원(빈 방)을 서비스 자원으로 전환 ③ 현지 경험 제공 — 호텔과 차별화된 진정성 있는 여행 경험 제공",explanation:"에어비앤비는 기술 혁신이 아닌 비즈니스 모델 혁신을 통해 기존 호텔 산업의 규칙을 바꿨습니다."},{id:"q15-1",week:15,type:"단답형",question:"팀 발표에서 좋은 발표란 내용의 정확성 외에 어떤 요소가 중요한지 3가지 이상 서술하시오.",answer:"① 명확한 구조와 논리적 흐름 ② 전문적인 시각자료 활용(Gamma, Napkin 등) ③ 청중과의 눈맞춤 및 적절한 발표 속도 ④ 날카로운 질의응답 준비",explanation:"효과적인 발표는 내용, 구조, 전달 방법, 시각화, 인터랙션이 조화롭게 이루어져야 합니다."},{id:"q15-2",week:15,type:"객관식",question:"팀 프로젝트 발표에서 질의응답 시 모르는 질문을 받았을 때 가장 적절한 대응은?",options:[{number:1,text:"즉시 틀렸다고 인정하고 답변 포기"},{number:2,text:"모른다고 솔직히 말하고 추후 확인 후 답변을 약속"},{number:3,text:"알고 있는 척 허위 정보를 제공"},{number:4,text:"질문을 무시하고 다음 질문자를 받음"}],answer:"2",explanation:"모르는 질문에 솔직히 인정하고 추후 확인을 약속하는 것이 신뢰성을 유지하는 전문적인 대응입니다."},{id:"q15-3",week:15,type:"OX",question:"팀 프로젝트 발표에서 AI 도구(Gamma, Napkin 등)를 활용한 시각자료는 발표의 전문성과 설득력을 높이는 데 도움이 된다.",answer:"O",explanation:"AI 도구를 활용한 전문적인 시각자료는 청중의 이해를 돕고 발표자의 메시지를 효과적으로 전달하는 데 기여합니다."},{id:"q15-4",week:15,type:"사례형",question:"서비스경영 팀 프로젝트 발표 시 루브릭 평가 기준(문제분석, 전략제안, AI 도구 활용, 발표 구성, 질의응답)에서 가장 높은 점수를 받기 위한 전략을 각 항목별로 제시하시오.",answer:"문제분석: 데이터 근거 제시 / 전략제안: 실행 로드맵 포함 / AI 도구: 결과물에 실제 반영 / 발표 구성: 스토리텔링 구조 / 질의응답: 예상 질문 사전 준비",explanation:"루브릭의 각 항목을 발표 준비 단계부터 의식적으로 고려하면 높은 평가를 받을 수 있습니다."},{id:"q16-1",week:16,type:"사례형",question:"16주간 서비스경영 수업에서 학습한 개념 중 실제 생활에 가장 유용하게 적용할 수 있는 것을 하나 선택하고, 구체적인 적용 방법을 서술하시오.",answer:"자유 서술 (예: 고객여정맵을 활용하여 아르바이트하는 카페의 서비스 개선점을 분석하고 제안함)",explanation:"이 문항은 학습 전이(Transfer of Learning)를 평가합니다. 실제 경험이나 생활에 개념을 연결하는 능력을 평가합니다."},{id:"q16-2",week:16,type:"객관식",question:"서비스경영 수업에서 배운 AI 도구 중 퀴즈와 평가 문항 생성에 가장 적합한 도구는?",options:[{number:1,text:"Napkin"},{number:2,text:"Felo"},{number:3,text:"Geminiami"},{number:4,text:"Genspark"}],answer:"3",explanation:"Geminiami는 퀴즈 생성, 중간·기말 복습문항, 객관식·단답형·사례형 평가문항 작성에 특화된 AI 도구입니다."},{id:"q16-3",week:16,type:"단답형",question:"16주 동안 학습한 서비스경영의 핵심 목표를 한 문장으로 정의하시오.",answer:"고객 가치 창출과 서비스 품질 향상을 통해 고객 만족과 기업 성과를 동시에 달성하는 것",explanation:"서비스경영은 고객 중심 사고와 지속적인 서비스 개선을 통해 고객 만족, 직원 만족, 기업 성과의 균형을 추구합니다."},{id:"q16-4",week:16,type:"OX",question:"포트폴리오는 단순히 과제 모음이 아니라, 학습 여정과 성장 과정을 스토리로 보여주는 자기 브랜딩 도구다.",answer:"O",explanation:"효과적인 포트폴리오는 결과물뿐 아니라 문제 인식, 해결 과정, 배운 점, 향후 적용 계획을 포함하여 학습자의 성장을 입증합니다."}],ss={OX:"bg-emerald-100 text-emerald-700 border-emerald-200",객관식:"bg-blue-100 text-blue-700 border-blue-200",단답형:"bg-orange-100 text-orange-700 border-orange-200",사례형:"bg-violet-100 text-violet-700 border-violet-200"};function Df(){var w,S;const[e,t]=z.useState(2),[n,r]=z.useState("전체"),[l,i]=z.useState(5),[o,a]=z.useState([]),[u,c]=z.useState(new Set),[x,h]=z.useState(!1),v=z.useMemo(()=>{const y={};for(let N=1;N<=16;N++){const b=cl.filter(M=>M.week===N);y[N]={전체:
